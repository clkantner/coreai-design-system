name: Verify Azure access (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'microsoft/coreai-design-system' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DOCSITE_APP_NAME: ${{ vars.DOCSITE_APP_NAME }}
      STORYBOOK_APP_NAME: ${{ vars.STORYBOOK_APP_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check required configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP DOCSITE_APP_NAME STORYBOOK_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment variable: $name"
              exit 1
            fi
          done
      - name: Sign in to Azure with OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify existing hosting authentication (read only)
        run: node .github/workflows/scripts/check-hosting-auth.mjs
      - name: Verify both apps are readable
        shell: bash
        run: |
          set -euo pipefail
          for app in "$DOCSITE_APP_NAME" "$STORYBOOK_APP_NAME"; do
            az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" \
              --query '{name:name,state:state}' --output json --only-show-errors
          done
